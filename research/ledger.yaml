# Canonical closed book. One row per hypothesis. Do not retune a REJECT.
# Print: python -m ats ledger
# Journal.md is the dated log. This file is the lookup.

protocol: >
  An edge is who pays you, after spread+slippage, on a frozen spec, with a
  baseline, on locked train/val, Bonferroni if a family, OOS locked until a
  survivor. Indicator combos are not a why. Do not reopen a REJECT because
  costs got cheaper or a knob looks unused.

how_we_pick:
  - "Forced flow: someone must trade (fixes, auctions, month-end, rolls)."
  - "Inventory: dealers skew quotes after a one-way run, then fade."
  - "Risk premium: you are paid to hold something others dump (H5 dip-buy)."
  - "Not an edge: EMA stacks, round numbers, VWAP stretch, PDH tags, volume spikes, NY-box folklore — already tested, all REJECT after costs."

do_not_reopen:
  - H1 news retrace
  - H2 3rd-tap
  - H3/H6 NY or London sweep-reclaim
  - H4/H7 Asia vs NY ORB
  - H8 ATR momentum continuation
  - H9 COT percentile width (n too small; do not widen)
  - H10 Rapid Bullet swings
  - H11 gold-DXY z
  - H12 London-close fade of prior 7 H1
  - H13 EMA200 expansion
  - H14-H16 any EMA/Dr.D stack
  - H17 PDH/PDL fade
  - H18 large-bar fade
  - H19 VWAP stretch fade
  - H20 volume-spike side
  - H21 $5 round
  - H22 NY 9:00-9:30 box fade-vs-break
  - H23 LBMA PM follow
  - H24 month-end MTD follow
  - H25 5-bar streak fade
  - H26 weekend gap fade
  - H27 WM 4pm follow (hit-rate only, negative R)
  - H28 Krohn postfix long EURUSD
  - H29 Krohn pre-ECB short EURUSD
  - H30 London-Asia break follow
  - H31 EURUSD 5-day TSMOM
  - H32 Ranaldo London-hours short
  - H33 inside-bar follow
  - H34 compression-expansion follow
  - H35 Friday 15:00 flatten
  - H36 London-NY overlap continuation
  - H37 EURUSD weekend-gap 36h (do not loosen; val n short)
  - H38 5-day cross-sectional FX momentum (do not flip to reversal)
  - H39 USDJPY Tokyo lunch fade
  - H40 NY-close Asia fade (hit-rate only, negative R)
  - H41 prior-day range fade
  - H42 Tokyo cash-close flatten
  - H43 EURUSD month-end USD bid (do not retune to quarter-end)

tests:
  - id: H1_event_reversal
    date: 2026-09-03
    book: fx_h1
    decision: REJECT
    mechanism: High-impact news overshoots; fade the large bar vs same bar with no news.
    baseline: Same 2.5 ATR bar, no news window.
    train: 67.8% vs 72.0%
    why_closed: News filter was worse than the unfiltered large bar. Do not retune 2.5 ATR or 40% retrace.

  - id: H2_tap_breakout
    date: 2026-09-03
    book: fx_h1
    decision: REJECT
    mechanism: Third tap of a swing cluster is absorption then breakout vs tap 1-2.
    baseline: Tap 1-2 of the same cluster.
    train: 57.3% vs 54.4%, p=0.12
    why_closed: 3pp noise. Do not retune cluster width or tap count.

  - id: H3_ny_open_sweep
