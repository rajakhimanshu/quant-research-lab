# Canonical closed book. One row per hypothesis. Do not retune a REJECT.
# Print: python -m ats ledger
# Journal.md is the dated log. This file is the lookup.

protocol: >
  An edge is who pays you, after spread+slippage, on a frozen spec, with a
  baseline, on locked train/val, Bonferroni if a family, OOS locked until a
  survivor. Indicator combos are not a why. Do not reopen a REJECT because
  costs got cheaper or a knob looks unused.

how_we_pick:
  - "Forced flow: someone must trade (fixes, auctions, month-end, rolls)."
  - "Inventory: dealers skew quotes after a one-way run, then fade."
  - "Risk premium: you are paid to hold something others dump (H5 dip-buy)."
  - "Not an edge: EMA stacks, round numbers, VWAP stretch, PDH tags, volume spikes, NY-box folklore — already tested, all REJECT after costs."

