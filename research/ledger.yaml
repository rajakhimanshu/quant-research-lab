    baseline: Same sweep rule 11-16 NY.
    train: 61.7% vs 54.9%, p=0.059; path expectancy negative
    why_closed: Hit-rate mirage. Do not retune stop/target or RR.

  - id: H4_asia_vs_ny_orb
