open:
  - "Working universe: FX majors + XAUUSD, intraday (M5/M15) and swing (H1). No stocks."
  - "Retail path: paper -> $100-200 live x several (execution) -> $1000-2000 -> EA. No grid. One symbol until a survivor."
  - H5_equity_rsi2 archived (equity-only paper). Out of scope. Do not port to gold/FX.
  - H9_cot_spec_fade still NEEDS_MORE_DATA (do not widen percentiles)
  - H37_weekend_gap_fx still NEEDS_MORE_DATA (val n=23; do not loosen 36h gap; do not peek OOS)
  - No FX/gold survivor. No MT5 EA until a paper candidate exists.
