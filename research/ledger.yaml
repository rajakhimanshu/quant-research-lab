    baseline: RSI(2)<10 below SMA200.
    train: 0.091R / val 0.136R / OOS 0.154R (unlocked after survivor)
    why_closed: Only paper book. Not live. Not FX. Do not retune RSI 10/65 or 200.

  - id: H6_london_sweep
