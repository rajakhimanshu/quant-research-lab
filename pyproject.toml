[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats"
version = "0.1.0"
description = "Proofbook: individual FX and gold hypothesis lab on MT5 data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ats = "ats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
