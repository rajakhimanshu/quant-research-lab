# Core lab settings. Change numbers here — do not hardcode them in strategy files.

broker:
  # Auto-detects an open terminal if empty. Override via MT5_TERMINAL_PATH in .env.
  terminal_path: ""
  # Broker symbol suffix if needed, e.g. "m" or ".a". Empty = exact / fuzzy match.
  symbol_suffix: ""

# Retail path. Not a live go. Do not size lab tests as if this is a fund.
retail:
  paper_then_live: true
  first_live_usd: [100, 200]
  scale_live_usd: [1000, 2000]
  min_lot: 0.01
  note: >
    Lab stays Python until a FX/gold paper candidate. Then several $100-200
    accounts for execution. Then $1000-2000. Then an EA. Min 0.01 lot means
    $100-200 cannot run 1% risk on a 15-pip stop. No grid or martingale.

universe:
  # Working book: FX majors + gold. No equities/crypto/indices.
  # Gold is requested per-hypothesis (XAUUSD M5/M15). EURUSD H1 from 2019-04-29
  # after the 5y pull. M5 FX is still a 100k-bar cap (~May 2025).
  symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - USDCAD
    - USDCHF
    - NZDUSD
  timeframe: H1
  lookback_years: 3

sessions_ist:
  asia: ["05:30", "13:30"]
  london: ["12:30", "21:00"]
  ny: ["18:30", "03:00"]
  london_ny_overlap: ["18:30", "21:00"]
  peak_ny: ["21:00", "23:30"]

features:
  atr_period: 14
  avg_body_period: 50
  swing_n: 5
  # Level cluster width as a multiple of ATR. Adaptive across pairs/JPY.
  level_tolerance_atr: 0.15
  tap_tolerance_atr: 0.12
  large_candle_atr: 2.5
  extreme_candle_atr: 3.5
  compression_atr_ratio: 0.7
  expansion_atr_ratio: 1.3

costs:
  # Exness Standard (commission-free). FX pips are 4/5-digit. Gold lab unit is
  # 0.001 (MT5 point). Exness quotes gold 1 pip = 0.01, so 20 Exness pips = 200
  # lab units = $0.20/oz. Numbers are this terminal's median bar spread
  # (XAUUSD M15 med 200 points; majors ~8-17 points / 10). Not advertising minima.
  source: exness_standard
  spread_pips:
    EURUSD: 0.8
    GBPUSD: 1.0
    USDJPY: 1.0
    AUDUSD: 1.1
    USDCAD: 1.5
    USDCHF: 1.2
    NZDUSD: 1.7
    XAUUSD: 200
  slippage_pips: 0.2
  slippage_by_symbol:
    XAUUSD: 20

validation:
  train: 0.60
  validation: 0.20
  oos: 0.20
  min_trades: 100
  max_train_val_gap: 0.20
  significance_alpha: 0.05
  # Applied after counting how many hypotheses were tested this run.
  multiple_testing: bonferroni

# Calendar locks. Do not move these after seeing results. Event-index 60/20/20
# shifts when you pull more bars — new tests use these dates instead.
splits:
  locked: true
  fx_h1:
    bar_start: "2023-09-04"
    bar_end: "2026-09-03"
    train_end: "2025-06-22"
    val_end: "2026-01-27"
    note: "Frozen 3y H1 cuts. EURUSD H1 now 2019-04-29 after a 5y pull (was a short stub). Do not move these dates."
  gold_m15:
    bar_start: "2022-06-10"
    bar_end: "2026-09-03"
    train_end: "2024-12-23"
    val_end: "2025-10-29"
  gold_m5:
    bar_start: "2025-04-07"
    bar_end: "2026-09-03"
    train_end: "2026-02-09"
    val_end: "2026-05-23"
    note: "Broker M5 gold history is 100k bars from 2025-04-07. Frozen 60/20/20 on that window before H14. Do not move after seeing H14."
  fx_m5:
    bar_start: "2025-05-05"
    bar_end: "2026-09-04"
    train_end: "2026-02-21"
    val_end: "2026-05-29"
    note: "EURUSD M5 broker cap 100k from 2025-05-05. Frozen 60/20/20 before H30. Do not move after seeing H30."
  equity_daily:
    train_end: "2020-02-27"
    val_end: "2023-03-16"
    note: "Published H5 audit. Paper book starts 2023-03-17."
