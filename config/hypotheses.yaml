  - id: H43_month_end_usd
    enabled: false
    name: Short EURUSD on the last 2 London sessions of the month vs days 10-12
    why: >
      Month-end equity rebalance buys US assets and bids USD, so an
      unconditional short EURUSD at 16:00 London on the last two sessions
      of the month should beat the same short on days 10-12 (no rebalance).
      Distinct from rejected H24 (gold follow month-to-date, not USD bid).
      One symbol, calendar rule, EA-shaped. EURUSD H1, 1:1 ATR, 16 bars.
      Frozen fx_h1. Do not retune to quarter-end after seeing results.
    params:
      symbols: [EURUSD]
      timeframe: H1
      signal_hour_london: 16
      month_end_days: 2
      base_days: [10, 11, 12]
      horizon_bars: 16
      stop_atr: 1.0
      target_atr: 1.0

