version: '1.0'
last_reviewed: '2026-09-26'
mechanisms:
- id: MECH_001
  name: Stop-cascade absorption (M5–M15 sweep-reclaim)
  causal_actor: 'Market makers absorb retail stop-hunt orders clustered just beyond
    recent intraday swing highs/lows; after the cascade clears, MM inventory skews
    quotes back toward pre-sweep price, driving a reclaim of the swept level within
    5–15 minutes.

    '
  natural_timeframe: M5–M15
  tier: retail_feasible
  causal_category: forced_flow
  reference: Harris Ch.10 — Dealer markets and inventory
  notes: 'Lab tested stop-pool fades at daily levels (H17, H46 REJECT). Not yet tested:
    intraday sweep-then-reclaim on M5/M15 with the wick itself as the stop rather
    than ATR. Distinct mechanism from H3/H6 (which used 0.5 ATR stop — the wrong stop
    anchor for a wick-based entry).

    '
- id: MECH_002
  name: Short-term liquidity-sweep mean reversion (M5–M30)
  causal_actor: 'Institutional order flow sweeps retail stop clusters at prior session
    intraday highs/lows to fill large resting buy/sell orders; once the sweep completes,
    the one-sided flow reverses as the liquidity vacuum closes and no new initiative
    flow arrives.

    '
  natural_timeframe: M5–M30
  tier: retail_feasible
  causal_category: forced_flow
  reference: Harris Ch.12 — Liquidity and trading costs
  notes: 'Broader family than MECH_001: applies to any session-level sweep, not just
    intraday swings. Requires a volume or tick-count confirmation proxy to distinguish
    sweep from directional breakout without tick-book data.

    '
- id: MECH_003
  name: Cross-pair lead-lag on minute bars (EURUSD → GBPUSD)
  causal_actor: 'EURUSD is the highest-volume FX pair; its price discovery leads GBPUSD
    by 1–3 M5 bars because GBPUSD dealers reprice their mid with a processing lag
    relative to EUR/USD moves, creating a brief, exploitable arbitrage window before
    the lag closes.

    '
  natural_timeframe: M5
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: Hasbrouck & Saar (2002) — Technology and liquidity provision
  notes: 'Not yet tested in this lab. Needs a rolling Granger-causality check on the
    current M5 FX data before committing to direction. Target: take a GBPUSD position
    in the direction of an EURUSD M5 close, exit within 3 bars.

    '
- id: MECH_004
  name: Post-news secondary drift (minutes-scale, not spike fade)
  causal_actor: 'After a high-impact macro print, slower institutional desks (regional
    banks, asset managers not algo-trading) read the release and reposition over 5–30
    minutes; their unidirectional accumulation flow creates a measurable secondary
    drift in the direction of the release surprise, opposite to the initial spike-and-fade.

    '
  natural_timeframe: M5–M30
  tier: retail_feasible
  causal_category: forced_flow
  reference: Evans & Lyons (2002) — Order flow and exchange rate dynamics
  notes: 'H1 tested the overshoot fade (first spike). This mechanism is the secondary
    drift that follows — not the initial move, not the fade, but the continuation
    5–30 min later. Lab has the economic calendar via `python -m ats calendar`. Needs:
    news direction proxy + drift entry 5 bars post-spike.

    '
- id: MECH_005
  name: Micro-session liquidity vacuum at London-NY overlap open
  causal_actor: 'At 13:00 London (18:30 IST), European market-makers who accumulated
    net long or short inventory through the London morning reduce their risk before
    end-of-day limits activate; the book briefly thins as they lift offers/hit bids
    to flatten, before full NY liquidity arrives and restores depth, creating a directional
    move into the vacuum.

    '
  natural_timeframe: M5–M15
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: Berger, Chaboud et al. (2008) — FX volume and volatility
  notes: 'H36 tested the London morning return followed into the overlap on H1 bars
    — REJECT. This is the M5/M15 version targeting the specific 13:00 inventory-offload
    mechanics, not the H1 directional continuation. Different entry mechanism and
    timeframe not yet tested.

    '
- id: MECH_006
  name: Inventory skew after one-sided retail tick volume (M5–M15)
  causal_actor: 'After N consecutive M5 bars with heavily one-sided tick volume (retail
    buying or selling), market-maker inventory accumulates on the opposite side; to
    offload, the MM widens the ask (if short) or narrows the bid (if long), creating
    mean reversion that persists for 3–8 bars.

    '
  natural_timeframe: M5–M15
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: Stoll (1978) — Dealer market model; Amihud & Mendelson (1980)
  notes: 'H25 tested a 5-bar same-direction bar streak on gold M15 — REJECT. That
    test used bar-close direction, not tick volume imbalance. This mechanism uses
    tick volume as the inventory proxy, which is available on MT5 M5 bars. Not yet
    tested with tick-volume confirmation.

    '
- id: MECH_007
  name: Cross-asset lead-lag gold → AUD at M5
  causal_actor: 'Gold price moves lead AUDUSD by 1–2 M5 bars because AUD is a commodity
    currency and AUD/USD dealers adjust their mid with a systematic lag relative to
    gold dealers, creating a brief exploitable window before the correlation reasserts.

    '
  natural_timeframe: M5
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: Granger causality in commodity-currency pairs literature
  notes: 'Not yet tested. Needs rolling Granger-causality on M5 gold vs AUDUSD before
    committing. Distinct from H11 (daily gold-DXY z-score — rejected) — this is a
    same-session minute-bar lead-lag, not a correlation break.

    '
- id: MECH_008
  name: Post-auction price discovery drift after LBMA AM (10:30 London)
  causal_actor: 'The LBMA AM Gold Price is set at 10:30 London via electronic auction;
    market participants who could not participate in the auction (smaller dealers,
    hedgers with delayed systems) then trade at spot to adjust their positions relative
    to the new benchmark, creating a 5–15 minute directional drift in the direction
    of the auction settlement.

    '
  natural_timeframe: M5–M15
  tier: retail_feasible
  causal_category: forced_flow
  reference: LBMA Gold Price methodology (2015 transition from fixing)
  notes: 'H23 tested LBMA PM (15:00 London) follow — REJECT. H172 tested a fade at
    10:30 — REJECT. Neither tested the post-auction drift mechanic: enter in the direction
    of the LBMA AM settlement price vs prior close, 10:35 entry, 8-bar hold on M5.
    Genuinely untested angle on the same clock.

    '
- id: MECH_009
  name: Tokyo fix pre-positioning (9:55 JST) on USDJPY M5
  causal_actor: 'Large Japanese corporations and banks submit yen fix orders to their
    banks before the 9:55 JST Tokyo fix; banks pre-position in the spot market 5–10
    minutes before the fix to manage their expected fix inventory, creating a directional
    M5 impulse into the 9:55 print.

    '
  natural_timeframe: M5
  tier: retail_feasible
  causal_category: forced_flow
  reference: Ito, Lyons & Melvin (1998) — Is there private information in the FX market?
  notes: 'H53 tested a 15-minute USDJPY follow into the fix on M15 — REJECT. This
    targets the pre-positioning window specifically at M5 resolution, entering at
    9:45–9:50 JST (pre-positioning begins) not at 9:55 (fix). The mechanism is the
    pre-hedge, not the fix itself. Distinct from H53.

    '
- id: MECH_010
  name: Tick-level order-flow imbalance (OFI) sub-second
  causal_actor: 'HFT firms detect imbalances between bid and ask queue depth within
    microseconds; their response to queue imbalance creates predictable short-term
    price pressure that cannot be acted on without co-location grade latency and level-2
    book data.

    '
  natural_timeframe: tick / sub-second
  tier: infra_gated
  causal_category: forced_flow
  reference: Cont, Kukanov & Stoikov (2014) — The price impact of order book events
  notes: 'Infra-gated: requires level-2 book data + co-location to be exploitable.
    MT5 retail execution latency (100ms+) eats the edge before it captures it. Deprioritize
    permanently unless capital/infra situation changes.

    '
- id: MECH_011
  name: Sub-second adverse selection by HFT market-makers
  causal_actor: 'HFT market-makers detect informed retail order flow within microseconds
    via quote-stuffing signals and widen spreads before retail orders fill; the fill
    price is always post-widening, making any edge from this mechanism negative for
    retail MT5 participants.

    '
  natural_timeframe: sub-second
  tier: infra_gated
  causal_category: forced_flow
  reference: Menkveld (2013) — High frequency trading and the new market makers
  notes: 'Infra-gated permanently. No retail MT5 configuration can compete here. This
    is Graviton territory (sub-microsecond infrastructure). Flag and never promote.

    '
- id: MECH_012
  name: FX option expiry clustering at NY 10:00 (daily)
  causal_actor: 'Large FX options expire at NY 10:00 cut daily; dealers who are net
    short gamma delta-hedge up to the fix, creating directional flow toward large
    open-interest strikes (barrier options, large round-number strikes) in the 30
    minutes before the cut.

    '
  natural_timeframe: M5–M15
  tier: retail_feasible
  causal_category: forced_flow
  reference: Heynen & Kat (1994) — Crossing barriers; BIS FX option survey
  notes: 'H90–H92 tested NY 10:00 cut fades (EURUSD, GBPUSD, USDJPY) — all REJECT.
    Those were unconditional fades. This mechanism requires open-interest data to
    identify the specific barriers being defended. Without publicly available OI data,
    this is currently untestable at retail. Flag for future: if barrier-watch services
    become available, revisit.

    '
- id: MECH_013
  name: Multi-currency inventory risk skew
  causal_actor: Market makers provide liquidity for wide variety of currency pairs;
    to mitigate flow uncertainty and inventory risk they systematically skew prices
    to attract/divert flow and trade with peers.
  natural_timeframe: M5M30
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: https://arxiv.org/abs/2207.04100v4
- id: MECH_014
  name: FX Dealer Pricing Ladders and Hedging
  causal_actor: Dealers internalize flow by skewing prices and waiting for clients,
    or externalize by hedging in the open market to reduce inventory risk, creating
    measurable price ladders.
  natural_timeframe: M5M30
  tier: retail_feasible
  causal_category: inventory_pressure
  reference: https://arxiv.org/abs/2112.02269v3
