  causal_category: forced_flow
  causal_actor: European corporates are forced to sell EUR for USD at 17:00 London
    to settle their expiring USD‑denominated forward contracts, leaving them no choice.
  timeframe_tier: ''
  instrument: EURUSD
  timeframe: M15
  expected_holding_bars: 10
  expected_trades_month: 120
  dedup_check:
  - H36_overlap_continuation
  - H87_monday_cash_gbp
  - H118_london_orb_eur
  - H130_hour_gap_eur
  - H136_pdc_tag_eur
  - H139_tnext_roll_eur
  - H145_ldn10_cut_eur
  - H151_tgt18_fade_eur
  notes: Differs from rejected WM 16:00 follow by targeting the 17:00 settlement of
    expiring forward contracts rather than the WM benchmark; it exploits forced settlement
    flow, not a price‑based fade.
