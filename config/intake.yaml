  name: Sydney Close Liquidity Vacuum Fade
  causal_category: structural_liquidity
  causal_actor: When the Sydney session ends around 02:00 GMT, Australian market‑makers
    pull back and the order book thins before Tokyo liquidity fully ramps up, creating
    a short‑lived vacuum.
  timeframe_tier: ''
  instrument: USDJPY
  timeframe: M5
  expected_holding_bars: 6
  expected_trades_month: 150
  dedup_check:
  - H42_tokyo_close_flatten
  - H89_monday_cash_aud
  - H121_tokyo_orb_jpy
  - H187_sgx17_fade_aud
  notes: Targets the Sydney‑to‑Tokyo transition, a structural liquidity dip not covered
    by the rejected Tokyo lunch, London lunch, or NY‑close Asia fades, and differs
    from other session‑clock ideas by focusing on the early‑morning GMT window before
    Tokyo activity spikes.
  status: rejected_at_intake
  id: INTAKE_008
  created: '2026-09-26'
  rejection_reason: Already tested sub-family of AUD session boundary ideas (H42,
    H89, H121, H187)
