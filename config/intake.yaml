  - H29_pre_ecb_usd
  - H32_ranaldo_local_hours
  - H38_xs_momentum
  - H43_month_end_usd
  - H55_nyse_open_eur
  - H75_ust_open_usd
  - H77_imm_usd_bid
  - H79_overnight_usd
  - H82_month_start_usd
  notes: Uses a 1‑3 M5‑bar lag between EURUSD and GBPUSD, not a simple fade; leverages
