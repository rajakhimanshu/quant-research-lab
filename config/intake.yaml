- source: llm_brainstorm
  source_ref: groq_forced_flow
  name: Post‑Tokyo Auction Drift on USDJPY
  causal_category: forced_flow
  causal_actor: Japanese banks are forced to trade immediately after the 9:55 Tokyo
    auction because they must unwind the net imbalance created by client orders they
    could not fill during the auction.
  timeframe_tier: ''
  instrument: USDJPY
  timeframe: M5
  expected_holding_bars: 6
  expected_trades_month: 120
  dedup_check:
  - H53_tokyo_fix_follow
  - H65_tse_open_follow
  notes: Uses the daily Tokyo auction imbalance, not the WM London fix or LBMA benchmarks,
    and targets the forced‑post‑auction rebalancing rather than any EMA/VWAP or news‑fade
    patterns that have been rejected.
  status: rejected_at_intake
  id: INTAKE_005
  created: '2026-09-26'
  rejection_reason: Already tested as H53_tokyo_fix_follow and H65_tse_open_follow
- source: llm_brainstorm
  source_ref: groq_forced_flow
  name: Swap Roll Unwind at 00:00 GMT
  causal_category: forced_flow
  causal_actor: Major banks are forced to unwind their 1‑day FX swap positions at
    the 00:00 GMT roll, regardless of price.
  timeframe_tier: retail_feasible
  instrument: EURUSD
  timeframe: M5
  expected_holding_bars: 8
  expected_trades_month: 35
  dedup_check: []
  notes: Targets the mandatory 1‑day swap roll rather than the previously rejected
    tom‑next fade; it exploits the forced‑flow pressure from banks needing to close
    swap legs at the roll time.
  status: rejected_at_intake
  id: INTAKE_006
  created: '2026-09-26'
  reviewed: '2026-09-27'
  rejection_reason: Impossible trade count (daily roll cannot yield 35 trades/month
    for a single pair) and failed manual review
