# Idea inbox. A lead is not a test. A test is not an edge.
# Promote to config/hypotheses.yaml only after a frozen why + frozen params.

protocol: >
  Take a lead from any source below. Write it as a precise H1/H2-style
  definition with a causal why. Freeze params. Then
  `python -m ats test --id ...` on fresh splits with costs. You accept or
  reject. This inbox does not hunt edges, scrape signals, or auto-code papers
  into EAs. Do not reopen H1–H7.

method:
  - Source a lead (paper, blog method, COT, dislocation, sentiment CSV).
  - Write a one-sentence mechanism (why), not an indicator combo.
  - Freeze entry, stop, target, horizon, baseline, costs — before seeing results.
  - Run train/validation only. Do not pass --unlock-oos until a survivor.
  - Journal accept/reject. Do not retune after the fact.

sources:
  academic: >
    SSRN and arXiv q-fin. Use `python -m ats ideas arxiv`. Papers are leads.
    You still write the why and freeze the spec. Do not copy a paper's backtest
    numbers onto this broker's book.
  blogs: >
    Methodology only, never signals: QuantConnect research posts, QuantInsti
    blog, Robot Wealth. If a post says "buy here", discard it. If it says
    "we test X vs Y with this baseline", that is a lead.
  cot: >
    CFTC Commitment of Traders, official weekly files.
    `python -m ats ideas cot` then `python -m ats test --id H9_cot_spec_fade`.
  cross_market: >
    Temporary breaks in usual links (gold vs DXY, yields vs USDJPY).
    `python -m ats ideas cross` is a snapshot. A z-score is not a trade until
    you freeze a why and a spec.
  sentiment: >
    Broker retail positioning (e.g. IG Client Sentiment). No login scrape.
    Drop a CSV at data/sentiment/*.csv with date,instrument,long_pct then
    `python -m ats ideas sentiment`. Extreme retail is a contrarian *lead*.

